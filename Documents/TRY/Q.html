<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <title>Signup Page</title>

    <style>
        body{
            background:#f4f4f4;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .signup-box{
            max-width:1000px;
            width:100%;
            background:#fff;
            border-radius:10px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,.15);
        }

        .left-side{
            background:#4f46e5;
            color:white;
            padding:60px 40px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
        }

        .left-side .btn{
            margin-top:30px;
            border-radius:30px;
            padding:12px 30px;
        }

        .right-side{
            padding:40px;
        }

        .social-icons a{
            text-decoration:none;
            font-size:28px;
            margin:0 10px;
        }

        @media(max-width:768px){
            .left-side{
                padding:40px 20px;
            }

            .right-side{
                padding:25px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row signup-box">

        <!-- Left Side -->
        <div class="col-md-6 left-side">

            <h1 class="fw-bold mb-5">Come join us!</h1>

            <p class="fs-5">
                We are so excited to have you here! If you haven't already,
                create an account to get access to exclusive offers,
                rewards, and discounts.
            </p>

            <button class="btn btn-light text-primary px-5">
                Already have an account? Signin
            </button>

        </div>

        <!-- Right Side -->
        <div class="col-md-6 right-side">

            <h1 class="text-center fw-bold mb-4">Signup</h1>

            <form>

                <div class="input-group mb-3">
                    <span class="input-group-text">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <input type="text" class="form-control" placeholder="Username">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">
                        <i class="bi bi-envelope-fill"></i>
                    </span>
                    <input type="email" class="form-control" placeholder="Email">
                </div>

                <div class="input-group mb-3">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" class="form-control" placeholder="Password">
                </div>

                <div class="input-group mb-4">
                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>
                    <input type="password" class="form-control" placeholder="Confirm Password">
                </div>

                <button class="btn btn-primary w-100">
                    Signup
                </button>

            </form>

            <p class="text-center my-4">or signup with</p>

            <div class="social-icons text-center">
                <a href="#"><i class="bi bi-facebook text-primary"></i></a>
                <a href="#"><i class="bi bi-twitter-x text-dark"></i></a>
                <a href="#"><i class="bi bi-instagram text-danger"></i></a>
            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
